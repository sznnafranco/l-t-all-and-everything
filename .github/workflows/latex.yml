name: LaTeX Build and Publish

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Explicitly allow push to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install TeX Live and latex2html
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra latex2html  # Install pdflatex and latex2html

      - name: Compile LaTeX to HTML using latex2html
        run: |
          mkdir -p output
          latex2html -dir=output chaps.tex  # This converts the LaTeX file to HTML
          # Copy source pdfs so the html links work
          cp cards-emental-physical.pdf output/
          cp cards-spiritual.pdf output/
          cp four-story.pdf output/
          cp games.pdf output/
          cp three-story.pdf output/
      - name: Compile LaTeX to PDF using pdflatex
        run: |
          pdflatex chaps.tex
          pdflatex chaps.tex  # Run twice to ensure TOC and references are correct
          mv chaps.pdf output/chaps.pdf  # Move the generated PDF to the output folder

      - name: Set up Git for gh-pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create gh-pages branch and push output
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r output/* .  # Copy HTML and PDF files to the root of gh-pages branch
          git add .
          git commit -m "Deploy HTML and PDF output"
          git push --force --set-upstream origin gh-pages

      - name: Publish HTML and PDF to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Corrected input
          publish_branch: gh-pages  # Corrected input
          publish_dir: .  # Corrected input
          disable_nojekyll: true  # Ensure `.nojekyll` is removed for proper processing
