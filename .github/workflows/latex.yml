name: LaTeX Build and Publish

on:
  push:
    branches:
      - l-t-all-and-everything  # Use the same branch name as your repo
  pull_request:
    branches:
      - l-t-all-and-everything  # Use the same branch name as your repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up TeX Live (LaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full  # Installs the full TeX Live distribution

      - name: Compile LaTeX to HTML using Pandoc
        run: |
          mkdir -p output
          pandoc chaps.tex -s -o output/index.html  # Ensure the LaTeX file is correct

      - name: Set up Git for gh-pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create gh-pages branch and push output
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r output/* .
          git add .
          git commit -m "Deploy HTML output"
          git push --force --set-upstream origin gh-pages

      - name: Publish HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .  # This pushes everything to the root of the gh-pages branch
