name: LaTeX Build and Publish

on:
  push:
    branches:
      - l-t-all-and-everything
  pull_request:
    branches:
      - l-t-all-and-everything

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Explicitly allow push to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install TeX Live and latex2html
        run: |
          sudo apt-get update
          sudo apt-get install -y latex2html

      - name: Compile LaTeX to HTML using latex2html
        run: |
          mkdir -p output
          latex2html -dir=output chaps.tex  # This converts the LaTeX file to HTML

      - name: List files in output directory
        run: ls -R output  # This will list all files in the output folder


      - name: Set up Git for gh-pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create gh-pages branch and push output
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r output/* .
          git add .
          git commit -m "Deploy HTML output"
          git push --force --set-upstream origin gh-pages

      - name: Publish HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .  # This pushes everything to the root of the gh-pages branch
