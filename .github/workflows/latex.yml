name: Simple Node.js 24 Test

on:
  push:
    branches:
      - l-t-all-and-everything  # or your branch name

jobs:
  test-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Verify Node.js version
        run: node -v

      - name: Run a simple Node.js script
        run: |
          node -e "console.log('Hello from Node.js', process.version)"