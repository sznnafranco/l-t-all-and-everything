name: LaTeX Build and Publish

on:
  push:
    branches:
      - l-t-all-and-everything
  pull_request:
    branches:
      - l-t-all-and-everything
      workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Explicitly allow push to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install TeX Live and latex2html
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra latex2html  # Install pdfpages

      - name: Compile LaTeX to HTML using latex2html
        run: |
          mkdir -p output
          latex2html -dir=output chaps.tex  # This converts the LaTeX file to HTML

      - name: Set up Git for gh-pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create gh-pages branch and push output
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r output/* .  # Copy HTML files to the root of gh-pages branch
          git add .
          git commit -m "Deploy HTML output"
          git push --force --set-upstream origin gh-pages

      - name: Publish HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Corrected input
          publish_branch: gh-pages  # Corrected input
          publish_dir: .  # Corrected input
          disable_nojekyll: true  # Ensure `.nojekyll` is removed for proper processing

