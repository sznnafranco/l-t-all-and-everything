name: Build Multiple LaTeX Books with Node.js 24

on:
  push:
    branches:
      - l-t-all-and-everything

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        book:
          - chaps
          - book_template

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install LaTeX and dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended latex2html
        timeout-minutes: 45

      - name: Create docs directory
        run: mkdir -p docs

      - name: Copy manual HTML files to docs
        run: |
          if [ -d "html" ]; then
            cp -r html/* docs/
          fi

      - name: Compile LaTeX to PDF for ${{ matrix.book }}
        run: |
          pdflatex -interaction=nonstopmode -output-directory=docs ${{ matrix.book }}.tex
          pdflatex -interaction=nonstopmode -output-directory=docs ${{ matrix.book }}.tex

      - name: Convert LaTeX to HTML for ${{ matrix.book }}
        run: |
          latex2html -output_directory docs/${{ matrix.book }}_html ${{ matrix.book }}.tex

      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs