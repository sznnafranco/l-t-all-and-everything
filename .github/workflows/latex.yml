name: Simple Node.js 24 Test and Book Build

on:
  push:
    branches:
      - l-t-all-and-everything  # or your branch name
#     - main                    # if needed

jobs:
  test-node-and-build-book:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Verify Node.js version
        run: node -v

      - name: Run a simple Node.js script
        run: node your_script.js

      - name: Install LaTeX
        run: |
          sudo apt-get update -y
          sudo apt-get install -y texlive-full

      - name: Run LaTeX and convert to HTML
        run: |
          pdflatex -interaction=nonstopmode chaps.tex
          pdflatex -interaction=nonstopmode book_template.tex
          pdflatex -interaction=nonstopmode chaps.tex
          pdflatex -interaction=nonstopmode book_template.tex

      - name: Upload files to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out