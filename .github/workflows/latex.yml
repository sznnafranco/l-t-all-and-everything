name: LaTeX Build and Publish

on:
  push:
    branches:
      - l-t-all-and-everything
  pull_request:
    branches:
      - l-t-all-and-everything

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up TeX Live (LaTeX)
        uses: actions/setup-tex@v1
        with:
          texlive-packages: "texlive-latex-base texlive-latex-recommended texlive-latex-extra"

      - name: Compile LaTeX to HTML using Pandoc
        run: |
          mkdir -p output
          pandoc chaps.tex -s -o output/index.html

      - name: Set up Git for gh-pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create gh-pages branch and push output
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r output/* .
          git add .
          git commit -m "Deploy HTML output"
          git push --force --set-upstream origin gh-pages

      - name: Publish HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .  # This pushes everything to the root of the gh-pages branch

