name: Build LaTeX and deploy PDF to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.tex'
      - '**.sty'
      - '**.bib'
      - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Build the PDF using xu-cheng/latex-action (runs latexmk)
    - name: Compile LaTeX
      uses: xu-cheng/latex-action@v2
      with:
        root_file: chaps.tex   # <-- change this to your root .tex file if different

    - name: Prepare public folder
      run: |
        mkdir -p public
        # Change main.pdf above if your output has a different name
        cp -v chaps.pdf public/

    - name: Deploy PDF to GitHub Pages (gh-pages branch)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: public
